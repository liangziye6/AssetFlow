<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image Prompt Builder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="top-logo" aria-hidden="true">
          <img src="assets/logo.png" alt="">
        </div>
        <div class="top-actions">
          <button id="pinWindowBtn" class="ghost-btn icon-ghost-btn pin-icon" type="button" title="打开可调整大小的独立窗口" aria-label="置顶"></button>
          <button id="apiToggleBtn" class="ghost-btn icon-ghost-btn settings-icon" type="button" aria-label="设置"></button>
        </div>
      </header>

      <section class="hero">
        <h1>Image to Prompt</h1>
      </section>

      <section id="apiPanel" class="api-panel" hidden>
        <div class="result-head">
          <span>API 接入</span>
          <small id="apiMeta">未配置</small>
        </div>
        <div class="api-sections">
          <section class="api-section">
            <div class="api-section-title">
              <strong>反推提示词 API</strong>
              <small>看图理解，用来生成提示词</small>
            </div>
            <div class="api-grid">
              <label>
                <span>服务商</span>
                <select id="promptApiProvider">
                  <option value="openai">OpenAI</option>
                  <option value="gemini">Google Gemini</option>
                  <option value="siliconflow">SiliconFlow</option>
                  <option value="custom">自定义</option>
                </select>
              </label>
              <label>
                <span>Base URL</span>
                <input id="promptApiBaseUrl" type="url" placeholder="https://api.openai.com/v1">
              </label>
              <label>
                <span>API Key</span>
                <div class="secret-field">
                  <input id="promptApiKey" type="password" placeholder="sk-...">
                  <button class="secret-toggle" type="button" data-target="promptApiKey" aria-label="查看反推 API Key" aria-pressed="false"></button>
                </div>
              </label>
              <label>
                <span>视觉模型</span>
                <select id="promptModelSelect">
                  <option value="gpt-4.1-mini">GPT-4.1 mini</option>
                  <option value="gpt-4o-mini">GPT-4o mini</option>
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                  <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                  <option value="qwen-vl-plus">Qwen VL Plus</option>
                  <option value="custom">自定义视觉模型</option>
                </select>
              </label>
            </div>
          </section>

          <section class="api-section">
            <div class="api-section-title">
              <strong>生图 API</strong>
              <small>提交提示词、尺寸和数量，生成图片</small>
            </div>
            <div class="api-grid">
              <label>
                <span>服务商</span>
                <select id="imageApiProvider">
                  <option value="openai">OpenAI</option>
                  <option value="apimart">APIMart</option>
                  <option value="runninghub">RunningHub</option>
                  <option value="jimeng">即梦</option>
                  <option value="siliconflow">SiliconFlow</option>
                  <option value="replicate">Replicate</option>
                  <option value="custom">自定义</option>
                </select>
              </label>
              <label>
                <span>Base URL</span>
                <input id="imageApiBaseUrl" type="url" placeholder="https://api.openai.com/v1">
              </label>
              <label>
                <span>API Key</span>
                <div class="secret-field">
                  <input id="imageApiKey" type="password" placeholder="sk-...">
                  <button class="secret-toggle" type="button" data-target="imageApiKey" aria-label="查看生图 API Key" aria-pressed="false"></button>
                </div>
              </label>
              <label>
                <span>生图模型</span>
                <select id="apiImageModelSelect">
                  <option value="gpt-image-1">GPT Image</option>
                  <option value="gpt-image-2">GPT Image 2</option>
                  <option value="runninghub-rhart-image-g-2">RunningHub 全能图片G-2.0 低价渠道版</option>
                  <option value="flux-pro">Flux Pro</option>
                  <option value="sdxl">SDXL</option>
                  <option value="midjourney">Midjourney</option>
                  <option value="doubao-seedream-4-0-250828">即梦-Doubao-Seedream-4.0</option>
                  <option value="doubao-seedream-4-5-251128">即梦-Doubao-Seedream-4.5</option>
                  <option value="custom">自定义生图模型</option>
                </select>
              </label>
              <label id="runningHubApiModeField" class="api-wide custom-model-field" hidden>
                <span>RunningHub 接口</span>
                <select id="runningHubApiMode">
                  <option value="consumer">消费级会员（AI应用）</option>
                  <option value="enterprise">企业级共享（Standard-API）</option>
                </select>
              </label>
              <label id="customModelField" class="api-wide custom-model-field" hidden>
                <span>自定义模型名</span>
                <input id="customModelName" type="text" placeholder="provider/model-name">
              </label>
            </div>
          </section>

          <section class="api-section api-section-wide">
            <div class="api-section-title">
              <strong>Eagle 收集 API</strong>
              <small>优先调用 Eagle 本地 API 收集图片；不可用时回退到 Eagle 协议跳转</small>
            </div>
            <div class="api-grid">
              <label>
                <span>收集方式</span>
                <select id="eagleApiMode">
                  <option value="api">Eagle Local API</option>
                  <option value="protocol">eagle:// 协议跳转</option>
                </select>
              </label>
              <label>
                <span>Eagle Base URL</span>
                <input id="eagleApiBaseUrl" type="url" placeholder="http://localhost:41595">
              </label>
              <label>
                <span>Eagle API Token</span>
                <input id="eagleApiToken" type="text" placeholder="14e5a376-cbb2-...">
              </label>
            </div>
          </section>
        </div>
        <div class="api-actions">
          <span id="apiSaveFeedback" class="api-save-feedback" role="status" aria-live="polite"></span>
          <button id="saveApiBtn" type="button">保存配置</button>
        </div>
      </section>

      <section class="workspace">
        <div class="image-panel">
          <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="添加图片">
            <input id="fileInput" type="file" accept="image/*" multiple>
            <img id="previewImage" alt="已添加图片">
            <div id="imageStack" class="image-stack" aria-label="已上传图片"></div>
            <button id="clearImageBtn" class="image-delete single-image-delete" type="button" aria-label="删除当前图片" title="删除当前图片" hidden></button>
            <div id="emptyState" class="empty-state">
              <span class="plus" aria-hidden="true"></span>
              <strong>添加图片</strong>
              <small>拖入网页图片、粘贴图片地址，或点击上传</small>
            </div>
          </div>
          <div class="image-meta">
            <span id="imageName">未选择图片</span>
            <span id="imageSize">尺寸待获取</span>
          </div>
        </div>

        <div class="control-panel">
          <section class="field-group">
            <button id="mascotBtn" class="mascot-widget" type="button" aria-label="IP 形象助手">
              <img src="assets/fries-mascot-cutout.png" alt="薯条吉祥物">
            </button>
            <div class="field-head">
              <div class="mode-tabs" role="tablist" aria-label="生图方式">
                <button id="textToImageModeBtn" class="mode-tab" type="button" role="tab" aria-selected="true">文生图</button>
                <button id="imageToImageModeBtn" class="mode-tab" type="button" role="tab" aria-selected="false">图生图</button>
              </div>
              <div class="inline-actions">
                <button id="reversePromptBtn" type="button">反推提示词</button>
                <button id="clearPromptBtn" type="button">清空</button>
              </div>
            </div>
            <div class="prompt-composer">
              <textarea id="promptInput" placeholder="图片提示词会出现在这里，也可以直接输入中文或英文。"></textarea>
              <div id="promptResizeHandle" class="prompt-resize-handle" role="separator" aria-label="调整提示词文本框高度"></div>
              <div class="prompt-toolbar">
                <div id="modelPicker" class="model-picker">
                  <button id="modelPickerBtn" class="model-picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="modelPickerText">GPT Image</span>
                    <span aria-hidden="true">⌄</span>
                  </button>
                  <div id="modelMenu" class="model-menu" role="listbox" hidden></div>
                  <select id="modelSelect">
                    <option value="gpt-image-1">GPT Image</option>
                    <option value="gpt-image-2">GPT Image 2</option>
                    <option value="runninghub-rhart-image-g-2">RunningHub 全能图片G-2.0 低价渠道版</option>
                    <option value="flux-pro">Flux Pro</option>
                    <option value="sdxl">SDXL</option>
                    <option value="midjourney">Midjourney</option>
                    <option value="doubao-seedream-4-0-250828">即梦-Doubao-Seedream-4.0</option>
                    <option value="doubao-seedream-4-5-251128">即梦-Doubao-Seedream-4.5</option>
                  </select>
                </div>
                <button id="copyPromptBtn" class="copy-prompt-btn" type="button" aria-label="复制提示词">
                  <span aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </section>

          <section class="settings-stack">
            <div class="size-row">
              <label>
                <span>图片尺寸</span>
                <div id="sizePicker" class="size-picker">
                  <button id="sizePickerBtn" class="size-picker-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
                    <span id="sizePickerText">获取原图尺寸</span>
                    <span aria-hidden="true">⌄</span>
                  </button>
                  <div id="sizeMenu" class="size-menu" hidden>
                    <div class="size-menu-section">
                      <span>比例</span>
                      <div id="ratioGrid" class="ratio-grid"></div>
                    </div>
                    <div class="size-menu-section">
                      <span>分辨率</span>
                      <div id="resolutionTabs" class="resolution-tabs"></div>
                    </div>
                  </div>
                </div>
                <select id="sizeMode">
                  <option value="auto">获取原图尺寸</option>
                  <option value="square">1024 × 1024</option>
                  <option value="portrait">1024 × 1536</option>
                  <option value="landscape">1536 × 1024</option>
                  <option value="16-9">16:9 · 1536 × 864</option>
                  <option value="9-16">9:16 · 864 × 1536</option>
                  <option value="3-4">3:4 · 1152 × 1536</option>
                  <option value="4-3">4:3 · 1536 × 1152</option>
                  <option value="2k">2K · 1920 × 1080</option>
                  <option value="4k">4K · 3840 × 2160</option>
                  <option value="custom">自定义</option>
                </select>
              </label>
              <label>
                <span>宽</span>
                <input id="widthInput" type="number" min="128" max="4096" step="64" value="1024">
              </label>
              <label>
                <span>高</span>
                <input id="heightInput" type="number" min="128" max="4096" step="64" value="1024">
              </label>
            </div>

            <label class="count-field">
              <span>数量</span>
              <div class="count-stepper">
                <input id="countInput" type="number" min="1" max="8" value="1">
                <div class="count-stepper-actions" aria-label="调整数量">
                  <button id="countUpBtn" class="count-stepper-up" type="button" aria-label="增加数量"></button>
                  <button id="countDownBtn" class="count-stepper-down" type="button" aria-label="减少数量"></button>
                </div>
              </div>
            </label>
          </section>

          <button id="generateBtn" class="generate-btn" type="button">生成图片</button>
          <p id="statusText" class="status-text">API 接入后，这里会显示生成进度。</p>
        </div>
      </section>

      <section id="galleryPanel" class="gallery-panel">
        <div class="result-head">
          <span>已生成</span>
          <small id="galleryMeta">图库为空</small>
        </div>
        <div id="galleryGrid" class="gallery-grid"></div>
      </section>

      <div id="lightbox" class="lightbox" hidden>
        <div class="lightbox-actions">
          <button id="lightboxDownloadBtn" class="lightbox-action-btn" type="button">下载图片</button>
          <button id="eagleCollectBtn" class="lightbox-action-btn" type="button">收集到 Eagle</button>
          <button id="lightboxClose" class="lightbox-action-btn" type="button">关闭</button>
        </div>
        <div class="lightbox-layout">
          <div class="lightbox-main">
            <img id="lightboxImage" alt="放大预览">
          </div>
          <div class="lightbox-info">
            <div id="lightboxMeta" class="lightbox-meta"></div>
            <div id="lightboxPrompt" class="lightbox-prompt"></div>
          </div>
          <div id="lightboxStrip" class="lightbox-strip" aria-label="已生成图片"></div>
        </div>
      </div>

    </main>

    <script src="popup.js"></script>
  </body>
</html>
