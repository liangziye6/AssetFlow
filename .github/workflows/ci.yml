name: AssetFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Project checks
        run: npm run check

      - name: Diff whitespace check
        run: git diff --check

      - name: Package extension
        run: npm run package
